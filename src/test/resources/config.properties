# =================================================================
# Configuration File for Web Automation Framework
# =================================================================
#
# WHAT IS THIS FILE?
# This file stores all configurable settings for the test framework.
# By keeping settings here (instead of in Java code), we can change
# the test environment, browser, or timeouts without recompiling.
#
# HOW TO USE:
# 1. Open this file in any text editor
# 2. Change the values as needed
# 3. Save the file
# 4. Run tests - they'll pick up the new values automatically
#
# FORMAT:
# Each line is: key = value
# Lines starting with # are comments (ignored by the framework)
# =================================================================


# =================================================================
# Application URL
# =================================================================
# The website we are testing. SauceDemo is a demo e-commerce site
# specifically designed for practicing test automation.
#
# Other test sites you could use:
#   https://www.saucedemo.com/           (what we use here)
#   https://the-internet.herokuapp.com/  (for various UI challenges)
#   https://www.google.com/              (basic search testing)
# =================================================================
app.url = https://www.saucedemo.com/


# =================================================================
# Browser Selection
# =================================================================
# Which browser to use for running tests.
# Supported values: chrome, firefox
#
# CHROME (default):  Fast, widely used, excellent DevTools
# FIREFOX:           Good alternative, privacy-focused
#
# To switch browsers, just change the value below:
# =================================================================
browser = chrome


# =================================================================
# Explicit Wait Timeout
# =================================================================
# The maximum time (in SECONDS) the framework will wait for an
# element to appear before throwing an error.
#
# RECOMMENDED VALUES:
#   5-10 seconds  -> Fast local tests (default: 10)
#   15-30 seconds -> Slow environments or remote servers
#   30+ seconds   -> Very slow pages (avoid if possible)
#
# If tests frequently fail with "timed out" errors,
# try increasing this value.
# =================================================================
explicit.wait = 10


# =================================================================
# Test Credentials
# =================================================================
# These are the standard test users for SauceDemo.
# The password is the same for all SauceDemo test accounts.
#
# SAUCEDEMO TEST USERS:
#   standard_user         -> Works normally for all tests
#   locked_out_user       -> Always fails login (for testing)
#   problem_user          -> Has UI bugs (pictures don't load)
#   performance_glitch_user -> Slow performance
#
# For most tests, use "standard_user".
# =================================================================
username = standard_user
password = secret_sauce
